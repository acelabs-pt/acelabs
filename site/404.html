<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada - Ace Labs</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#ffffff;
    --gray-bg:#f5f5f7;
    --ink:#1d1d1f;
    --ink-2:#6e6e73;
    --blue:#0071e3;
    --blue-dark:#0059b3;
    --blue-soft-bg:#eaf2fd;
    --line:rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;flex-direction:column;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    background:linear-gradient(180deg, #ffffff 0%, #f4f5f7 55%, #eef0f3 100%);
  }
  h1{margin:0;font-weight:700;letter-spacing:-0.015em;}
  p{margin:0;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:560px;margin:0 auto;padding:0 24px;}

  header{padding:32px 0;}
  .logo{display:flex;align-items:center;gap:0;}
  .logo img{height:22px;display:block;}

  main{flex:1;display:flex;align-items:center;}
  .content{text-align:center;padding:40px 0 80px;}
  .code{
    font-family:'Source Serif 4',serif;
    font-size:15px;
    font-weight:500;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--blue);
    margin-bottom:18px;
  }
  h1{font-size:40px;line-height:1.15;margin-bottom:16px;}
  .sub{color:var(--ink-2);font-size:17px;line-height:1.55;margin-bottom:36px;}
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:13px 24px;border-radius:999px;
    font-size:15px;font-weight:600;
    transition:transform .15s ease, background .15s ease;
  }
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:hover{background:#000;transform:translateY(-1px);}
  .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:rgba(0,0,0,.18);transform:translateY(-1px);}

  @media (max-width:480px){
    h1{font-size:32px;}
    .sub{font-size:16px;}
  }
</style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="logo" href="/"><img src="ace-labs-logo.png" alt="Ace Labs"></a>
    </div>
  </header>
  <main>
    <div class="wrap">
      <div class="content">
        <p class="code">Erro 404</p>
        <h1>Esta página não existe.</h1>
        <p class="sub">O link pode estar desatualizado ou mal escrito. Volta ao início e diz-nos quem és - agente ou agência.</p>
        <div class="actions">
          <a class="btn btn-primary" href="/">Página inicial</a>
          <a class="btn btn-ghost" href="/agencias.html#contacto">Marcar diagnóstico</a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
