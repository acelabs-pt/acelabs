<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 40px; }
  .aviso { background: #fff4e5; color: #9a5b00; border: 2px solid #ff9f0a; padding: 10px 16px;
           font-weight: bold; text-align: center; margin-bottom: 24px; }
  .cartao { border: 3px solid #0a1620; border-radius: 12px; max-width: 480px; padding: 24px; }
  .titulo { font-size: 12px; letter-spacing: 1px; color: #6e6e73; text-transform: uppercase; }
  h1 { font-size: 18px; margin: 4px 0 16px; }
  .campo { margin-bottom: 10px; }
  .campo label { display: block; font-size: 10px; color: #6e6e73; text-transform: uppercase; }
  .campo span { font-size: 14px; font-weight: 600; }
</style>
</head>
<body>
  <div class="aviso">DOCUMENTO DE TESTE - DADOS FICTÍCIOS - NÃO É UM DOCUMENTO OFICIAL</div>
  <div class="cartao">
    <div class="titulo">Cartão de Cidadão (amostra de teste)</div>
    <h1>República Portuguesa</h1>
    <div class="campo"><label>Nome</label><span>Ana Exemplo Silva</span></div>
    <div class="campo"><label>Nacionalidade</label><span>Portuguesa (PRT)</span></div>
    <div class="campo"><label>Data de nascimento</label><span>14 03 1985</span></div>
    <div class="campo"><label>Sexo</label><span>F</span></div>
    <div class="campo"><label>NIF</label><span>299999990</span></div>
    <div class="campo"><label>Nº documento</label><span>99999999 0 ZZ0</span></div>
    <div class="campo"><label>Validade</label><span>10 06 2030</span></div>
    <div class="campo"><label>Estado civil</label><span>Casada</span></div>
    <div class="campo"><label>Morada</label><span>Rua de Teste, nº 12, 3º Dto, 4400-000 Vila Nova de Gaia</span></div>
  </div>
</body>
</html>
