<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cockpit</title>
<style>
  :root { --tinta: #1d1d1f; --sec: #6e6e73; --azul: #0071e3; --fundo: #f5f5f7; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
    background: var(--fundo); color: var(--tinta);
    display: flex; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 360px; text-align: center; }
  h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0 0 8px; }
  p { font-size: 17px; line-height: 1.4; color: var(--sec); margin: 0 0 24px; }
  button {
    min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px;
    background: var(--azul); color: #fff; font: inherit; font-size: 17px; font-weight: 600;
  }
  button:active { opacity: 0.85; }
</style>
</head>
<body>
<main>
  <h1>Sem ligação</h1>
  <p>O Cockpit precisa de internet para abrir. Liga o wifi ou os dados móveis e tenta outra vez.</p>
  <button id="de-novo" type="button">Tentar outra vez</button>
</main>
<script src="servidor.js"></script>
<script>
  // O Capacitor trouxe-nos aqui porque o endereço da app não respondeu: voltar a tentar.
  function tentar() { window.location.href = window.COCKPIT_URL; }
  document.getElementById("de-novo").addEventListener("click", tentar);
  window.addEventListener("online", tentar);
</script>
</body>
</html>
