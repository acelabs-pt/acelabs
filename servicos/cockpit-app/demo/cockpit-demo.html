const KEY = 'cockpit-demo-v1';
let S;
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {}
  return seed();
}

/* ===== tarefas (calendário) ===== */
function addTarefa(t) {
  if (t.chave && S.tarefas.some((x) => x.chave === t.chave)) return null;
  const nt = { id: uid(), tipo: 'tarefa', inicio: null, feita: false, feitaEm: null, noCal: true, origem: 'manual', ...t };
  S.tarefas.push(nt);
  return nt;
}

/* ===== compradores: automações ===== */
const contar = (c) => ({ env: c.imoveis.filter((i) => i.env).length, vis: c.imoveis.filter((i) => i.vis).length, prop: c.imoveis.filter((i) => i.prop).length });
function alertaLaranja(c) { return c.estado === 'lead_qualificada' && diasDesde(c.estadoDesde) >= 10 ? `${diasDesde(c.estadoDesde)} dias sem enviar imóveis` : null; }
const corProg = (n, o) => n >= o ? 'var(--verde)' : n >= o / 2 ? 'var(--ambar)' : '#ef4444';
function tarefasSemanais() {
  const sem = semanaISO(new Date());
  const h9 = new Date(); h9.setHours(9, 0, 0, 0);
  for (const c of S.compradores) {
    const n = contar(c);
    if (c.estado === 'lead_qualificada' || (c.estado === 'imoveis_enviados' && n.env < OBJ.env))
      addTarefa({ titulo: `Enviar opções de imóveis a ${c.nome}`, inicio: h9.toISOString(), origem: 'comprador', compId: c.id, chave: `c:${c.id}:enviar:${sem}` });
    else if (c.estado === 'visitas_realizadas' && n.vis < OBJ.vis)
      addTarefa({ titulo: `Propor visita a ${c.nome}`, inicio: h9.toISOString(), origem: 'comprador', compId: c.id, chave: `c:${c.id}:visita:${sem}` });
  }
}
function avancarC(c, estado) { if (c.estado !== 'perdido' && idxC(estado) > idxC(c.estado)) { c.estado = estado; c.estadoDesde = new Date().toISOString(); } }
function concluirC(c) {
  c.estado = 'negocio_concluido'; c.estadoDesde = new Date().toISOString();
  const q = new Date(); q.setMonth(q.getMonth() + 6); q.setHours(9, 0, 0, 0);
  addTarefa({ titulo: `Ligar a ${c.nome} (6 meses após a escritura)`, inicio: q.toISOString(), origem: 'comprador', compId: c.id, chave: `c:${c.id}:pos-escritura` });
}

/* ===== proprietários: automações ===== */
function planoP(nome, r) {
  const em = (ms) => addMs(r, ms);
  return [
    ['reuniao', 'evento', r, `Reunião de angariação: ${nome}`],
    ['aviso', 'tarefa', em(-2 * H), `Daqui a 2 horas: reunião de angariação com ${nome}`],
    ['agradecimento', 'tarefa', em(2 * H), `Mensagem de agradecimento a ${nome}`],
    ['dossier', 'tarefa', em(2 * D), `Enviar Dossier Digital + página de Instagram a ${nome}`],
    ['vendido', 'tarefa', em(7 * D), `Partilhar um imóvel vendido com ${nome} (exemplo, de forma natural)`],
    ['fu1', 'tarefa', em(14 * D), `Chamada a ${nome}: ponto de situação da venda por conta própria`],
    ['fu2', 'tarefa', em(22 * D), `Chamada a ${nome}: ponto de situação da venda por conta própria`],
    ['angariar', 'tarefa', em(30 * D), `Chamada de angariação a ${nome}: fechar angariação`],
  ];
}
function agendarFU(p, r) {
  for (const [k, tipo, q, titulo] of planoP(p.nome, r)) {
    const ex = S.tarefas.find((t) => t.chave === `p:${p.id}:${k}`);
    if (!ex) addTarefa({ titulo, tipo, inicio: q.toISOString(), origem: 'proprietario', propId: p.id, chave: `p:${p.id}:${k}` });
    else if (!ex.feita) { ex.inicio = q.toISOString(); ex.titulo = titulo; }
  }
}
const TAREFAS_FASE = { reuniao_angariacao: ['aviso', 'reuniao'], dossier_enviado: ['dossier'], imovel_vendido_enviado: ['vendido'], follow_up_1: ['fu1'], follow_up_2: ['fu2'], angariado: ['angariar'] };
function concluirFase(p, estado) {
  for (const k of TAREFAS_FASE[estado] || []) { const t = S.tarefas.find((x) => x.chave === `p:${p.id}:${k}`); if (t && !t.feita) { t.feita = true; t.feitaEm = new Date().toISOString(); } }
}

/* ===== angariações: plano ===== */
const nBlocos = (dur) => dur / 10;
const blocoDeDia = (dia) => Math.floor(dia / 10) + 1;
const diaIni = (b) => (b - 1) * 10;
const dataDoDia = (ini, dia) => addDays(parseDate(ini), dia);
const diaHoje = (ini) => Math.round((startOfDay(new Date()) - parseDate(ini)) / 86400000) + 1;
const blocoAtual = (ini, dur) => { const d = diaHoje(ini); return d < 1 || d > dur ? null : Math.ceil(d / 10); };
function tarefaDeAcao(a, ang) {
  const q = dataDoDia(ang.inicio, a.dia); q.setHours(9, 0, 0, 0);
  return { titulo: a.followUp ? `Follow up com o proprietário: ${ang.titulo}` : `${a.nome}: ${ang.titulo}`, inicio: q.toISOString(), origem: 'angariacao', acaoId: a.id, chave: `a:${a.id}`, feita: a.feita, feitaEm: a.feitaEm };
}
function novaAcao(ang, nome, dia, followUp) { const a = { id: uid(), nome, dia, followUp: !!followUp, feita: false, feitaEm: null, feedback: '' }; ang.acoes.push(a); addTarefa(tarefaDeAcao(a, ang)); return a; }
function criarPlano(ang, nomes, fu, dur, extras) {
  ang.duracao = dur; const max = nBlocos(dur);
  for (const [nome, blocos] of ACOES_PADRAO) if (nomes.includes(nome)) for (const b of blocos) if (b <= max) novaAcao(ang, nome, diaIni(b), false);
  if (fu) for (const b of FOLLOW_BLOCOS) if (b <= max) novaAcao(ang, NOME_FU, diaIni(b) + 5, true);
  for (const e of extras) if (e.bloco <= max) novaAcao(ang, e.nome, diaIni(e.bloco), false);
}
function marcarAcao(ang, a, feita) {
  a.feita = feita; a.feitaEm = feita ? new Date().toISOString() : null;
  const t = S.tarefas.find((x) => x.acaoId === a.id); if (t) { t.feita = feita; t.feitaEm = a.feitaEm; }
}
function marcarVendido(ang, data) {
  ang.vendidoEm = data;
  for (const a of ang.acoes) { const t = S.tarefas.find((x) => x.acaoId === a.id); if (t && !t.feita) t.noCal = data === null; }
}

/* ===== peças de interface ===== */
const mot = (v) => {
  if (v === '' || v == null) return '<span class="xs sec" title="Motivação por definir">-</span>';
  const cor = `hsl(${(v / 10) * 120} 70% 42%)`;
  return `<span class="mot" title="Motivação ${v}/10"><span class="t"><i style="width:${Math.max(v, 0.5) * 10}%;background:${cor}"></i></span><b style="color:${cor}">${v}</b></span>`;
};
const opts = (lista, sel, vazio) => (vazio !== undefined ? `<option value="">${esc(vazio)}</option>` : '') + lista.map((o) => `<option${o === sel ? ' selected' : ''}>${esc(o)}</option>`).join('');
function locSel(ctx, v, rot) {
  const cs = comAtual(concelhosDe(v.d), v.c), fs = comAtual(freguesiasDe(v.d, v.c), v.f), ds = comAtual(DISTRITOS, v.d);
  const mk = (nome, name, lista, val, dis) => {
    const s = `<select name="${name}" data-loc="${ctx}" ${dis ? 'disabled' : ''}>${opts(lista, val, nome)}</select>`;
    return rot ? `<label class="f"><span>${nome}</span>${s}</label>` : s;
  };
  return mk('Distrito', 'distrito', ds, v.d, false) + mk('Concelho', 'concelho', cs, v.c, !v.d) + mk('Freguesia', 'freguesia', fs, v.f, !v.c);
}
const progresso = (rot, n, o) => `<div><div class="row between xs sec"><span>${rot}</span><span>${n}/${o}</span></div><div class="barra" style="margin-top:4px"><i style="width:${Math.min(100, (n / o) * 100)}%;background:${corProg(n, o)}"></i></div></div>`;
const seg = (acao, atual, itens) => `<div class="seg">${itens.map(([v, r]) => `<button data-a="${acao}" data-v="${v}" class="${atual === v ? 'on' : ''}">${r}</button>`).join('')}</div>`;
const voltar = (href, txt) => `<a href="${href}" class="sm">&larr; ${txt}</a>`;
const erroBox = () => ui.erro ? `<p class="erro">${esc(ui.erro)}</p>` : '';
const linhaLocal = (o) => [o.tipo, o.tipologia, o.concelho || o.distrito].filter(Boolean).join(' · ');

/* ===== Compradores: lista e funil ===== */
function filtrarC(todos) {
  const f = ui.cf;
  return S.compradores.filter((c) => {
    if (f.tipo && c.tipo !== f.tipo) return false;
    if (f.tipologia && c.tipologia !== f.tipologia) return false;
    if (f.d && c.distrito !== f.d) return false;
    if (f.c && c.concelho !== f.c) return false;
    if (f.f && c.freguesia !== f.f) return false;
    if (f.vmin && (c.valor ?? -1) < Number(f.vmin)) return false;
    if (f.vmax && (c.valor ?? Infinity) > Number(f.vmax)) return false;
    if (f.mot && (c.motivacao ?? -1) < Number(f.mot)) return false;
    if (f.soAl && !alertaLaranja(c)) return false;
    return todos ? c.estado !== 'perdido' : !['perdido', 'negocio_concluido'].includes(c.estado);
  });
}

  const n = contar(c), al = alertaLaranja(c);

}

/* ===== Proprietários: lista e funil ===== */
const proxAcao = (pid) => S.tarefas.filter((t) => t.propId === pid && !t.feita && t.inicio && t.noCal).sort((a, b) => a.inicio.localeCompare(b.inicio))[0];
const atrasadoP = (pid) => { const t = proxAcao(pid); return !!(t && new Date(t.inicio) < new Date()); };
function filtrarP() {
  const f = ui.pf;
  return S.proprietarios.filter((p) => {
    if (f.tipo && p.tipo !== f.tipo) return false;
    if (f.tipologia && p.tipologia !== f.tipologia) return false;
    if (f.d && p.distrito !== f.d) return false;
    if (f.c && p.concelho !== f.c) return false;
    if (f.f && p.freguesia !== f.f) return false;
    if (f.vmin && (p.valor ?? -1) < Number(f.vmin)) return false;
    if (f.vmax && (p.valor ?? Infinity) > Number(f.vmax)) return false;
    if (f.soAtr && !atrasadoP(p.id)) return false;

}

}

/* ===== Angariações: plano e grelha ===== */
const bandeira = (f) => `<svg viewBox="0 0 24 24" fill="${f ? '#fff' : '#d93025'}"><path d="M5 3v18h2v-7h11l-2-4 2-4H7V3z"/></svg>`;
function grelha(a) {
  const nb = nBlocos(a.duracao), at = blocoAtual(a.inicio, a.duracao), hoje = new Date();
  const presentes = [...new Set(a.acoes.map((x) => x.nome))];
  const padrao = ACOES_PADRAO.map((x) => x[0]).filter((x) => presentes.includes(x));
  const linhas = [...(presentes.includes(NOME_FU) ? [NOME_FU] : []), ...padrao, ...presentes.filter((x) => x !== NOME_FU && !padrao.includes(x))];
  const bs = Array.from({ length: nb }, (_, i) => i + 1);
  const bv = a.vendidoEm ? Math.min(nb, Math.max(1, Math.ceil(((parseDate(a.vendidoEm) - parseDate(a.inicio)) / 86400000 + 1) / 10))) : null;
  const FASES = ['1ª fase', '2ª fase', '3ª fase'];
  return `<div class="gscroll"><table class="g"><thead>
  <tr><th class="nome"></th>${Array.from({ length: nb / 6 }, (_, i) => `<th colspan="6" class="fase">${FASES[i]}</th>`).join('')}</tr>
  <tr><th class="nome"></th>${Array.from({ length: nb / 3 }, (_, i) => `<th colspan="3" class="mes">${(i + 1) * 30} dias</th>`).join('')}</tr>
  <tr><th class="nome"></th>${bs.map((b) => `<th class="bl ${b === at ? 'at' : ''}">${b === bv ? 'Vendido' : b * 10}</th>`).join('')}</tr></thead><tbody>
  ${linhas.map((nome) => `<tr><th class="nome">${esc(nome)}</th>${bs.map((b) => {
    const x = a.acoes.find((y) => y.nome === nome && blocoDeDia(y.dia) === b);
    if (!x) return `<td style="padding:0">${ui.editarPlano ? `<button class="cel vazia" data-a="gr-vazia" data-nome="${esc(nome)}" data-b="${b}" aria-label="Adicionar">+</button>` : '<div class="cel" style="background:none"></div>'}</td>`;
    const atr = !x.feita && dataDoDia(a.inicio, b * 10) < hoje;
    return `<td style="padding:0"><button class="cel ${x.feita ? 'feita' : atr ? 'atr' : x.followUp ? 'fu' : ''}" data-a="gr-abrir" data-ac="${x.id}">${x.followUp ? bandeira(x.feita) : x.feita ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l4 4 10-10"/></svg>' : '<span class="o"></span>'}</button></td>`;
  }).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function sheetAcao(a) {
  const x = a.acoes.find((y) => y.id === ui.sheet);
  if (!x) return '';
  const b = blocoDeDia(x.dia), de = dataDoDia(a.inicio, (b - 1) * 10), ate = dataDoDia(a.inicio, b * 10 - 1);
  return `<div class="sheetbg" data-a="sheet-fechar"><div class="sheet stack-s" data-stop="1">
  <div class="row between" style="align-items:flex-start"><div><h2>${x.followUp ? 'Follow up com o proprietário' : esc(x.nome)}</h2><p class="sm sec">Dias ${(b - 1) * 10 + 1} a ${b * 10} (${fmtDia(de)} a ${fmtDia(ate)})</p></div><button class="txt sec" style="text-decoration:none;font-size:26px;line-height:1" data-a="sheet-fechar">&times;</button></div>
  <button class="btn full ${x.feita ? 'cinza' : 'verde'}" style="padding:12px" data-a="ac-toggle" data-ac="${x.id}">${x.feita ? 'Desmarcar (voltar a por fazer)' : 'Marcar como feita'}</button>
  <label class="f"><span>Feedback</span><textarea rows="3" data-c="ac-fb" data-ac="${x.id}" placeholder="O que aconteceu? Fica no relatório.">${esc(x.feedback)}</textarea></label>
  <button class="txt verm" style="text-decoration:none;width:100%" data-a="ac-retirar" data-ac="${x.id}">Retirar do plano</button></div></div>`;
}
function viewAngPlano(id) {
  const a = byId(S.angariacoes, id);

/* ===== Calendário ===== */
function linhaTarefa(t, apagar) {
  const atr = !t.feita && t.inicio && new Date(t.inicio) < startOfDay(new Date());
  return `<li class="tarefa"><button class="circ ${t.feita ? 'on' : ''}" data-a="t-toggle" data-tid="${t.id}" aria-label="Marcar">${t.feita ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l4 4 10-10"/></svg>' : ''}</button>
  <div class="grow"><p class="trunc ${t.feita ? 'feita' : ''}">${t.tipo === 'evento' ? '<span style="color:var(--azul)">&#9679;</span> ' : ''}${esc(t.titulo)}</p><p class="xs" style="color:${atr ? 'var(--ambar-t)' : 'var(--sec)'}">${[t.inicio ? fmtDia(t.inicio) : 'Sem data', t.inicio ? fmtHora(t.inicio) : '', { meta: 'Meta', comprador: 'Comprador', proprietario: 'Proprietário', angariacao: 'Angariação' }[t.origem] || ''].filter(Boolean).join(' · ')}</p></div>
  ${apagar ? `<button class="txt sec" style="text-decoration:none;padding:8px" data-a="t-apagar" data-tid="${t.id}" aria-label="Apagar">&times;</button>` : ''}</li>`;
}
function viewCal() {
  const ts = S.tarefas.filter((t) => t.noCal);
  const h0 = startOfDay(new Date()), h1 = addDays(h0, 1);
  const form = `<form data-s="t-nova" class="card sm stack-s"><input name="titulo" placeholder="Nova tarefa ou marcação" required><div class="row wrap"><input type="datetime-local" name="quando" style="flex:1;min-width:170px;font-size:14px"><select name="tipo" style="width:auto;font-size:14px"><option value="tarefa">Tarefa</option><option value="evento">Marcação</option></select><button class="btn" type="submit">Adicionar</button></div></form>`;
  let corpo;
  if (ui.calVista === 'tarefas') {
    const g = { 'Em atraso': [], Hoje: [], 'Próximas': [], 'Sem data': [], 'Feitas (últimas 10)': [] };
    for (const t of ts) { if (t.feita) g['Feitas (últimas 10)'].push(t); else if (!t.inicio) g['Sem data'].push(t); else { const d = new Date(t.inicio); (d < h0 ? g['Em atraso'] : d < h1 ? g.Hoje : g['Próximas']).push(t); } }
    g['Feitas (últimas 10)'] = g['Feitas (últimas 10)'].slice(-10).reverse();
    corpo = ts.length ? Object.entries(g).filter(([, l]) => l.length).map(([r, l]) => `<section><h3 style="margin-bottom:8px;color:${r === 'Em atraso' ? 'var(--ambar-t)' : 'var(--sec)'}">${r} (${l.length})</h3><ul class="stack-s">${l.map((t) => linhaTarefa(t, true)).join('')}</ul></section>`).join('') : '<p class="sec sm" style="text-align:center;padding:32px 0">Ainda não há tarefas.</p>';
  } else {
    const dias = Array.from({ length: 7 }, (_, i) => addDays(ui.semana, i)), fim = addDays(ui.semana, 6);
    corpo = `<div class="row between sm"><button class="btn cinza sm" data-a="sem" data-v="-7">Anterior</button><b>${fmtDiaCurto(ui.semana)} - ${fmtDiaCurto(fim)}</b><button class="btn cinza sm" data-a="sem" data-v="7">Seguinte</button></div>
    <div class="semana">${dias.map((d) => { const x = ts.filter((t) => t.inicio && sameDay(new Date(t.inicio), d)); return `<section class="dia ${sameDay(d, new Date()) ? 'hoje' : ''}"><h3>${fmtDia(d)}</h3>${x.length ? x.map((t) => `<button class="evt ${t.feita ? 'feita' : ''}" data-a="t-toggle" data-tid="${t.id}"><span class="xs sec" style="display:block">${fmtHora(t.inicio)}</span>${esc(t.titulo)}</button>`).join('') : '<p class="xs sec" style="opacity:.6;padding:0 4px">-</p>'}</section>`; }).join('')}</div>`;
  }
  return `<div class="stack"><div class="row between"><h1>Calendário</h1><div class="seg" style="min-width:180px">${[['tarefas', 'Tarefas'], ['semana', 'Semana']].map(([v, r]) => `<button data-a="cal-vista" data-v="${v}" class="${ui.calVista === v ? 'on' : ''}">${r}</button>`).join('')}</div></div>${erroBox()}${form}${corpo}</div>`;
}

const go = (hash) => { location.hash = hash; };

/* ===== tarefas: marcar ===== */
function toggleTarefa(t) {
  t.feita = !t.feita; t.feitaEm = t.feita ? new Date().toISOString() : null;
  if (t.acaoId) for (const a of S.angariacoes) { const x = a.acoes.find((y) => y.id === t.acaoId); if (x) { x.feita = t.feita; x.feitaEm = t.feitaEm; } }
}
// Na ficha do proprietário, marcar uma tarefa leva o funil para a fase correspondente (só avança).
function tarefaDoProprietario(tid) {
  const t = byId(S.tarefas, tid), p = t && byId(S.proprietarios, t.propId);
  if (!t || !p) return;
  const alvo = ESTADO_TAREFA[tipoTarefaP(t.chave)];
  if (!t.feita && alvo === 'angariado' && p.estado !== 'perdido') { abrirFechar(p); return; }
  toggleTarefa(t);
  if (t.feita && alvo && p.estado !== 'perdido' && idxP(alvo) > idxP(p.estado)) { p.estado = alvo; p.estadoDesde = new Date().toISOString(); }
  commit();
}
function abrirFechar(p) { ui.fechar = { titulo: [p.tipo, p.tipologia, p.freguesia || p.concelho].filter(Boolean).join(' ') || p.nome, regime: '' }; render(); }

/* ===== formulários de pessoa ===== */
function pessoaDeForm(fd, kind) {
  const g = (k) => (fd.get(k) || '').toString().trim();
  const numero = g('numero').replace(/\s+/g, '');
  const o = { nome: g('nome'), tel: numero ? g('prefixo') + numero : '', email: g('email'), canal: g('canal'), obs: g('obs'), tipo: g('tipo'), tipologia: g('tipologia'), distrito: g('distrito'), concelho: g('concelho'), freguesia: g('freguesia'), valor: g('valor') === '' ? null : Number(g('valor')) };
  if (kind === 'c') Object.assign(o, { motivacao: g('motdef') ? Number(g('motivacao')) : null, ref: g('ref'), financ: g('financ'), simul: g('simul'), precisaVender: g('precisaVender') });
  else o.link = g('link');
  return o;
}

  },
  'gr-abrir'(el) { ui.sheet = el.dataset.ac; render(); },
  'gr-vazia'(el) { const a = angAtual(); const nome = el.dataset.nome; novaAcao(a, nome, diaIni(Number(el.dataset.b)) + (nome === NOME_FU ? 5 : 0), nome === NOME_FU); commit(); },
  'sheet-fechar'(el, e) { if (el.classList.contains('sheetbg') && e.target.closest('[data-stop]')) return; ui.sheet = null; render(); },
  'ac-toggle'(el) { const a = angAtual(), x = a.acoes.find((y) => y.id === el.dataset.ac); marcarAcao(a, x, !x.feita); commit(); },
  'ac-retirar'(el) { if (!confirm('Retirar esta ação do plano?')) return; const a = angAtual(); a.acoes = a.acoes.filter((x) => x.id !== el.dataset.ac); S.tarefas = S.tarefas.filter((t) => t.acaoId !== el.dataset.ac); ui.sheet = null; commit(); },
};
document.addEventListener('click', (e) => { const el = e.target.closest('[data-a]'); if (!el) return; const f = ACOES[el.dataset.a]; if (f) f(el, e); });

/* ===== alterações em campos ===== */
function filtroLoc(el, ctx) {
  const f = ctx === 'cf' ? ui.cf : ui.pf, n = el.name;
  if (n === 'distrito') { f.d = el.value; f.c = ''; f.f = ''; } else if (n === 'concelho') { f.c = el.value; f.f = ''; } else f.f = el.value;
  render();
}
function locForm(el) {
  const box = el.closest('[data-ctx]'), sel = (n) => box.querySelector(`[name=${n}]`).value;
  let v = { d: sel('distrito'), c: sel('concelho'), f: sel('freguesia') };
  if (el.name === 'distrito') v = { d: v.d, c: '', f: '' }; else if (el.name === 'concelho') v.f = '';
  box.innerHTML = locSel('form', v, true);
}
const CAMBIOS = {
  cf(el) { ui.cf[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value; render(); },
  pf(el) { ui.pf[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value; render(); },
  vendidas(el) { ui.mostrarVendidas = el.checked; render(); },
  'pl-acao'(el) { const n = el.dataset.nome, e = ui.plano.escolhidas; ui.plano.escolhidas = el.checked ? [...e, n] : e.filter((x) => x !== n); },
  'pl-fu'(el) { ui.plano.fu = el.checked; },
  'c-cpcv'(el) { const c = byId(S.compradores, el.dataset.id); c.cpcv = el.checked; c.cpcvData = el.checked ? c.cpcvData || hojeISO() : null; if (el.checked) avancarC(c, 'cpcv'); commit(); },
  'c-escag'(el) { const c = byId(S.compradores, el.dataset.id); c.escAgendada = el.checked; if (el.checked) avancarC(c, 'escritura'); commit(); },
  'c-data'(el) { const c = byId(S.compradores, el.dataset.id); c[el.dataset.k] = el.value || null; commit(); },
  'c-doc'(el) { const c = byId(S.compradores, el.dataset.id), d = c.docs.find((x) => x.id === el.dataset.doc); d.ok = el.checked; commit(); },
  'p-tarefa'(el) { tarefaDoProprietario(el.dataset.tid); },
  'ac-fb'(el) { const x = angAtual().acoes.find((y) => y.id === el.dataset.ac); x.feedback = el.value.trim(); save(); },
};
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.loc) return el.dataset.loc === 'form' ? locForm(el) : filtroLoc(el, el.dataset.loc);
  const f = CAMBIOS[el.dataset.c]; if (f) f(el);
});
document.addEventListener('input', (e) => { const el = e.target; if (el.dataset.c === 'range') { const m = $('#motv'), h = $('[name=motdef]'); if (m) m.textContent = el.value; if (h) h.value = '1'; } });

/* ===== submissão de formulários ===== */
const SUBMIT = {
  'c-form'(f) { const id = f.dataset.id, o = pessoaDeForm(new FormData(f), 'c'); if (id) Object.assign(byId(S.compradores, id), o); else { const c = { id: uid(), estado: 'lead_qualificada', estadoDesde: new Date().toISOString(), cpcv: false, cpcvData: null, escAgendada: false, escData: null, escPrazo: null, docs: [], imoveis: [], ...o }; S.compradores.unshift(c); save(); return go('#/crm/compradores/' + c.id); } save(); go('#/crm/compradores/' + id); },
  'p-form'(f) { const id = f.dataset.id, o = pessoaDeForm(new FormData(f), 'p'); if (id) Object.assign(byId(S.proprietarios, id), o); else { const p = { id: uid(), estado: 'fsbo', estadoDesde: new Date().toISOString(), reuniaoEm: null, ...o }; S.proprietarios.unshift(p); save(); return go('#/crm/proprietarios/' + p.id); } save(); go('#/crm/proprietarios/' + id); },
  'c-img-add'(f) { const c = byId(S.compradores, f.dataset.id), d = f.elements.desc.value.trim(); if (!d) return; c.imoveis.push({ id: uid(), desc: d, env: hojeISO(), vis: null, prop: null }); avancarC(c, 'imoveis_enviados'); commit(); },
  'c-doc-add'(f) { const c = byId(S.compradores, f.dataset.id), n = f.elements.nome.value.trim(); if (!n) return; c.docs.push({ id: uid(), nome: n, ok: false }); commit(); },
  'p-reuniao'(f) { const p = byId(S.proprietarios, f.dataset.id), q = new Date(f.elements.quando.value); p.reuniaoEm = q.toISOString(); if (p.estado === 'fsbo') { p.estado = 'reuniao_marcada'; p.estadoDesde = new Date().toISOString(); } agendarFU(p, q); commit(); },
  'p-chamada'(f) { const p = byId(S.proprietarios, f.dataset.id); S.chamadas.push({ id: uid(), propId: p.id, quando: new Date(f.elements.quando.value).toISOString(), obs: f.elements.obs.value.trim() }); commit(); },
  'p-fechar'(f) {
    const p = byId(S.proprietarios, f.dataset.id); if (!ui.fechar || !ui.fechar.regime) return;
    if (!S.angariacoes.some((a) => a.propId === p.id)) S.angariacoes.push({ id: uid(), propId: p.id, titulo: f.elements.titulo.value.trim(), duracao: Number(f.elements.dur.value), regime: ui.fechar.regime, inicio: f.elements.inicio.value, vendidoEm: null, acoes: [] });
    p.estado = 'angariado'; p.estadoDesde = new Date().toISOString(); concluirFase(p, 'angariado'); ui.fechar = null; commit();
  },
  'ang-criar'(f) { const e = f.elements; const a = { id: uid(), propId: null, titulo: e.titulo.value.trim(), duracao: Number(e.dur.value), regime: e.regime.value || null, inicio: e.inicio.value, vendidoEm: null, acoes: [] }; S.angariacoes.unshift(a); ui.nova = false; save(); go('#/angariacoes/' + a.id); },
  'pl-extra'(f) { ui.plano.extras.push({ nome: f.elements.nome.value.trim(), bloco: Number(f.elements.bloco.value) }); render(); },
  'ac-juntar'(f) { const a = byId(S.angariacoes, f.dataset.id), nome = f.elements.nome.value.trim(), b = Number(f.elements.bloco.value); if (!nome) return; const fu = nome === NOME_FU; novaAcao(a, nome, diaIni(b) + (fu ? 5 : 0), fu); commit(); },
  't-nova'(f) { const e = f.elements; addTarefa({ titulo: e.titulo.value.trim(), tipo: e.tipo.value, inicio: e.quando.value ? fromLocalInput(e.quando.value) : null }); commit(); },
};
document.addEventListener('submit', (e) => { const f = e.target; const fn = SUBMIT[f.dataset.s]; if (fn) { e.preventDefault(); fn(f); } });

/* ===== arranque ===== */
S = load();
save();
window.addEventListener('hashchange', render);
render();

</script>
</body>
</html>
